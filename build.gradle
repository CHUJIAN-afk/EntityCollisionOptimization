plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.smokeTest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        ecopt_tests {
            sourceSet(sourceSets.smokeTest)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.ecopt]
            gameDirectory = file('run/client')
        }
        server {
            server()
            loadedMods = [mods.ecopt]
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.smokeTest
            loadedMods = [mods.ecopt, mods.ecopt_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ecopt_tests'
            gameDirectory = file('run/gametest-1.21.1')
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.smokeTest
            loadedMods = [mods.ecopt, mods.ecopt_tests]
            systemProperty 'ecopt.smoke.client', 'true'
            gameDirectory = file('run/client-verification-1.21.1')
        }
    }
}

tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    doFirst {
        def smokeDirectory = file('run/client-verification-1.21.1')
        smokeDirectory.mkdirs()
        new File(smokeDirectory, 'options.txt').text = 'onboardAccessibility:false\nrealmsNotifications:false\n'
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    doFirst {
        def dup = fileTree('run/client/mods') { include "${mod_id}-*.jar" }.files
        if (!dup.isEmpty()) {
            throw new GradleException("run/client/mods 中存在 ${mod_id} 本体 jar（${dup}），会与 classpath 版本重复加载，请先移走。")
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
