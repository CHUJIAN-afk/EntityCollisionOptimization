buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

// MixinGradle：负责 refmap 生成与混入配置注入（MixinConfigs 清单项）
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// 集成测试使用独立模组源集，发布 jar 只包含 main。
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run/client-1.20.1')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server-1.20.1')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run/gametest-1.20.1')
            property 'forge.enabledGameTestNamespaces', 'ecopt_tests'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
                ecopt_tests { source sourceSets.smokeTest }
            }
        }
        clientSmoke {
            parent minecraft.runs.client
            workingDirectory project.file('run/client-verification-1.20.1')
            property 'ecopt.smoke.client', 'true'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
                ecopt_tests { source sourceSets.smokeTest }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// MixinGradle 的 refmap 落在 build/tmp 下，不属于 compileJava 的缓存输出：
// 一旦命中构建缓存，jar 里就会缺 ecopt.refmap.json（Forge 生产环境按 SRG 运行，缺了就无法重映射）。
tasks.named('compileJava', JavaCompile).configure {
    outputs.cacheIf { false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

// MixinGradle 默认只在打包时加入 refmap；同时提供给开发运行的资源目录。
var generateMixinResources = tasks.register('generateMixinResources', Copy) {
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
    rename { "${mod_id}.refmap.json" }
    into layout.buildDirectory.dir('generated/resources/mixin')
}
sourceSets.main.resources.srcDir generateMixinResources

tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    doFirst {
        def smokeDirectory = file('run/client-verification-1.20.1')
        smokeDirectory.mkdirs()
        def options = new File(smokeDirectory, 'options.txt')
        if (!options.exists()) {
            // 独立自动验收实例跳过首次辅助功能引导，并关闭 Realms 通知。
            options.text = 'onboardAccessibility:false\nrealmsNotifications:false\n'
        }
    }
}

tasks.named('jar', Jar).configure {
    filesMatching("${mod_id}.refmap.json") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}
